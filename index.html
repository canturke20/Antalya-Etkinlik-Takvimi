<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antalya Canlı Etkinlik Paneli</title>
    <style>
        :root { --bg: #090d16; --surface: #131c2e; --primary: #38bdf8; --accent: #f59e0b; --text: #f8fafc; --muted: #94a3b8; --border: #23324d; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 24px 16px; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .title h1 { font-size: 26px; font-weight: 800; color: #fff; }
        .btn-apple { background: #fff; color: #000; padding: 10px 18px; border-radius: 8px; font-size: 14px; font-weight: 700; text-decoration: none; }
        .filters { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .filters input, .filters select { background: var(--bg); color: #fff; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 14px; outline: none; }
        .chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; }
        .chip { padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; background: var(--surface); color: var(--muted); cursor: pointer; border: 1px solid var(--border); white-space: nowrap; }
        .chip.active { background: var(--primary); color: #000; border-color: var(--primary); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; justify-content: space-between; }
        .tag { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; background: rgba(56, 189, 248, 0.15); color: var(--primary); display: inline-block; margin-bottom: 8px; }
        .source-tag { font-size: 11px; color: var(--muted); background: var(--bg); padding: 3px 6px; border-radius: 4px; float: right; }
        .event-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; line-height: 1.35; }
        .desc { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.4; }
        .meta { border-top: 1px dashed var(--border); padding-top: 10px; font-size: 13px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 12px; font-size: 13px; }
        .actions a { color: var(--primary); text-decoration: none; font-weight: 700; }
        .actions a:hover { text-decoration: underline; }
        .empty { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--muted); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title">
                <h1>🌴 Antalya Canlı Etkinlik Paneli</h1>
                <p style="color:var(--muted); font-size:14px; margin-top:4px;">Doğrudan Biletix & Bubilet Resmi Satış Linkleri</p>
            </div>
            <a href="antalya_etkinlikler.ics" download class="btn-apple"> Apple Takvime Aktar</a>
        </header>

        <div class="filters">
            <input type="text" id="searchInput" placeholder="Gerçek etkinlik veya mekan ara...">
            <select id="sourceFilter">
                <option value="ALL">Tüm Kaynaklar (Biletix & Bubilet)</option>
                <option value="Biletix">Biletix</option>
                <option value="Bubilet">Bubilet</option>
            </select>
        </div>

        <div class="chips" id="chips">
            <div class="chip active" data-cat="ALL">Tümü</div>
            <div class="chip" data-cat="Konser & Sahne">Konser & Sahne</div>
            <div class="chip" data-cat="Tiyatro">Tiyatro</div>
            <div class="chip" data-cat="Stand-Up & Komedi">Stand-Up & Komedi</div>
            <div class="chip" data-cat="Parti & Festival">Parti & Festival</div>
        </div>

        <div class="grid" id="grid">
            <div class="empty">Canlı etkinlik verileri yükleniyor...</div>
        </div>
    </div>

    <script>
        let events = [];
        let activeCat = "ALL";

        async function loadEvents() {
            try {
                // events.json'ı cache olmadan çek
                const res = await fetch('events.json?t=' + new Date().getTime());
                events = await res.json();
                render();
            } catch (err) {
                document.getElementById("grid").innerHTML = '<div class="empty">Etkinlikler yüklenirken bir sorun oluştu. Lütfen botun çalışmasını bekleyin.</div>';
            }
        }

        function render() {
            const search = document.getElementById("searchInput").value.toLowerCase();
            const source = document.getElementById("sourceFilter").value;
            const grid = document.getElementById("grid");

            let filtered = events.filter(ev => {
                const mCat = activeCat === "ALL" || ev.category === activeCat;
                const mSource = source === "ALL" || ev.source === source;
                const mSearch = ev.title.toLowerCase().includes(search) || ev.venue.toLowerCase().includes(search);
                return mCat && mSource && mSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty">Aradığınız kriterlere uygun güncel etkinlik bulunamadı.</div>';
                return;
            }

            grid.innerHTML = filtered.map(ev => `
                <div class="card">
                    <div>
                        <div>
                            <span class="tag">${ev.category}</span>
                            <span class="source-tag">${ev.source}</span>
                        </div>
                        <div class="event-title">${ev.title}</div>
                        <div class="desc">${ev.description}</div>
                        <div class="meta">
                            <div>📍 ${ev.venue} (${ev.district})</div>
                            <div>🏷️ <b style="color:var(--accent);">${ev.price}</b></div>
                        </div>
                    </div>
                    <div class="actions">
                        <a href="${ev.ticket_url}" target="_blank" style="color:#38bdf8; font-size:14px;">Bilet Al / Resmi Sayfa ↗</a>
                    </div>
                </div>
            `).join("");
        }

        document.getElementById("searchInput").addEventListener("input", render);
        document.getElementById("sourceFilter").addEventListener("change", render);
        document.querySelectorAll(".chip").forEach(c => {
            c.addEventListener("click", () => {
                document.querySelectorAll(".chip").forEach(x => x.classList.remove("active"));
                c.classList.add("active");
                activeCat = c.getAttribute("data-cat");
                render();
            });
        });

        loadEvents();
    </script>
</body>
</html>
