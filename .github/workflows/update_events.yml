name: Gunluk Antalya Etkinlik Guncellemesi

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Python Ortamini Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Playwright ve Kutuphaneleri Yukle
        run: |
          python -m pip install --upgrade pip
          pip install playwright bs4
          playwright install chromium

      - name: Etkinlikleri Guncelle
        run: python scraper.py

      - name: Takvim Dosyalarini Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json antalya_etkinlikler.ics
          git commit -m "Playwright ile gercek etkinlikler cekildi" || echo "Degisiklik yok"
          git push || echo "Push atlandi"
