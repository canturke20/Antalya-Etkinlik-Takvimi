name: Gunluk Antalya Etkinlik Guncellemesi

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Al
        uses: actions/checkout@v4

      - name: Python Ortamini Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: pip install -r requirements.txt

      - name: Etkinlikleri Guncelle
        run: python scraper.py

      - name: Takvim Dosyalarini Kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json antalya_etkinlikler.ics index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Antalya etkinlikleri otomatik güncellendi" && git push)
