name: Gunluk Antalya Etkinlik Guncellemesi

on:
  schedule:
    # Her sabah 06:00'da (TSİ) kendi kendine çalışır
    - cron: '0 3 * * *'
  workflow_dispatch: # İstediğin zaman elle de tetikleyebilirsin

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri Yukle
        run: pip install -r requirements.txt

      - name: Etkinlikleri Guncelle
        run: python scraper.py

      - name: Takvimi Kaydet ve Push Et
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add events.json antalya_etkinlikler.ics index.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Antalya etkinlikleri güncellendi" && git push)
